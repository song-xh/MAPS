<rect x="32" y="103" width="320" height="38" rx="7" class="card"/><text x="47" y="127" class="body">选择示例 / 本地数据文件</text><text x="330" y="126" class="body muted">⌄</text>
<rect x="368" y="103" width="200" height="38" rx="7" class="card"/><text x="383" y="127" class="body">RL-CAPA</text><text x="546" y="126" class="body muted">⌄</text>
<rect x="584" y="103" width="350" height="38" rx="7" class="card"/><text x="599" y="127" class="body muted">选择已有模型及配套配置</text><text x="912" y="126" class="body muted">⌄</text>
