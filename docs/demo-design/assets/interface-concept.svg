<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
<title id="title">CAPA Demo 轻量两标签页设计</title>
<desc id="desc">静态布局示意，无运行数据。两个标签页，加载数据与模型、运行、地图和算法详情、播放控制。地图和对象为示意。</desc>
<defs><style>text{font-family:"Microsoft YaHei","Segoe UI",Arial,sans-serif;fill:#20344c}.muted{fill:#75869a}.small{font-size:12px}.body{font-size:14px}.heading{font-size:17px;font-weight:600}.white{fill:#fff}.accent{fill:#097b86}.card{fill:#fff;stroke:#e1e8f0;stroke-width:1}.line{stroke:#e4eaf1;stroke-width:1}</style><clipPath id="map"><rect x="52" y="358" width="844" height="324" rx="10"/></clipPath></defs>
<rect width="1440" height="900" fill="#f4f7fb"/><rect width="1440" height="64" fill="#fff"/><line x1="0" y1="64" x2="1440" y2="64" class="line"/>
